<!DOCTYPE1 html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPS Test - Contador de Clics</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: #38bdf8;
      text-align: center;
    }

    .settings {
      background-color: #1e293b;
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .settings label {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .settings input {
      width: 80px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background-color: #1e293b;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .stat-box {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .click-area {
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 3px dashed #38bdf8;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, background-color 0.2s;
    }

    .click-area:active {
      transform: scale(0.98);
      background: linear-gradient(135deg, #334155, #475569);
    }

    .click-area h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      pointer-events: none;
    }

    .click-area p {
      color: #94a3b8;
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* Modal de Resultados */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal h2 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .modal p {
      font-size: 1.2rem;
      margin: 10px 0;
      line-height: 1.5;
    }

    .modal button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .modal button:hover {
      background-color: #7dd3fc;
    }

    footer {
      margin-top: 30px;
      font-size: 1rem;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Prueba de CPS</h1>

    <div class="settings">
      <label for="timeInput">Segundos:</label>
      <input type="number" id="timeInput" min="1" max="100" value="6">
    </div>

    <div class="stats-bar">
      <div class="stat-box">
        <div class="stat-value" id="timer">6.0s</div>
        <div class="stat-label">Tiempo restante</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="clickCount">0</div>
        <div class="stat-label">Clics</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="currentCps">0.0</div>
        <div class="stat-label">CPS actual</div>
      </div>
    </div>

    <div class="click-area" id="clickArea">
      <h2 id="areaText">¡Haz clic aquí para empezar!</h2>
      <p id="subText">El tiempo comenzará con tu primer clic</p>
    </div>
  </div>

  <!-- Ventana emergente de resultados -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>¡Tiempo terminado!</h2>
      <p id="resultClicks">Hiciste 0 clics</p>
      <p id="resultTime">en 0 segundos.</p>
      <p id="resultCps">CPS obtenido: 0.00</p>
      <p id="resultBest" style="color: #4ade80; font-weight: bold; margin-top: 10px;">¡Tu mejor CPS!</p>
      <button id="restartBtn">Probar de nuevo</button>
    </div>
  </div>

  <footer>
    Hecho por AwaKristal
  </footer>

  <script>
    const clickArea = document.getElementById('clickArea');
    const areaText = document.getElementById('areaText');
    const subText = document.getElementById('subText');
    const timeInput = document.getElementById('timeInput');
    const timerDisplay = document.getElementById('timer');
    const clickCountDisplay = document.getElementById('clickCount');
    const currentCpsDisplay = document.getElementById('currentCps');
    
    const modalOverlay = document.getElementById('modalOverlay');
    const resultClicks = document.getElementById('resultClicks');
    const resultTime = document.getElementById('resultTime');
    const resultCps = document.getElementById('resultCps');
    const resultBest = document.getElementById('resultBest');
    const restartBtn = document.getElementById('restartBtn');

    let totalTime = parseFloat(timeInput.value) || 6;
    let timeLeft = totalTime;
    let clicks = 0;
    let timer = null;
    let isRunning = false;
    let bestCps = 0;

    // Actualizar tiempo inicial al cambiar el input
    timeInput.addEventListener('change', () => {
      let val = parseFloat(timeInput.value);
      if (isNaN(val) || val <= 0) val = 1;
      timeInput.value = val;
      totalTime = val;
      if (!isRunning) {
        timeLeft = totalTime;
        timerDisplay.textContent = timeLeft.toFixed(1) + 's';
      }
    });

    clickArea.addEventListener('pointerdown', (e) => {
      e.preventDefault();

      if (!isRunning) {
        startTest();
      }

      if (timeLeft > 0) {
        clicks++;
        clickCountDisplay.textContent = clicks;
        
        let timeElapsed = (totalTime - timeLeft);
        if (timeElapsed > 0) {
          let liveCps = clicks / timeElapsed;
          currentCpsDisplay.textContent = liveCps.toFixed(1);
        }
      }
    });

    function startTest() {
      isRunning = true;
      clicks = 0;
      totalTime = parseFloat(timeInput.value) || 6;
      timeLeft = totalTime;
      timeInput.disabled = true;

      clickCountDisplay.textContent = '0';
      currentCpsDisplay.textContent = '0.0';
      areaText.textContent = '¡Sigue cliqueando!';
      subText.textContent = '¡Rápido!';

      let startTime = Date.now();

      timer = setInterval(() => {
        let elapsed = (Date.now() - startTime) / 1000;
        timeLeft = totalTime - elapsed;

        if (timeLeft <= 0) {
          timeLeft = 0;
          finishTest();
        }

        timerDisplay.textContent = timeLeft.toFixed(1) + 's';
        
        if (elapsed > 0 && isRunning) {
          let liveCps = clicks / elapsed;
          currentCpsDisplay.textContent = liveCps.toFixed(1);
        }
      }, 50);
    }

    function finishTest() {
      clearInterval(timer);
      isRunning = false;
      timeInput.disabled = false;
      
      let finalCps = clicks / totalTime;

      // Actualizar récord de CPS si se supera
      if (finalCps > bestCps) {
        bestCps = finalCps;
      }

      // Configurar mensajes finales en el modal
      resultClicks.textContent = `Te hiciste ${clicks} ${clicks === 1 ? 'click' : 'clicks'}`;
      resultTime.textContent = `en ${totalTime} ${totalTime === 1 ? 'segundo' : 'segundos'}.`;
      resultCps.textContent = `Tu CPS promedio fue: ${finalCps.toFixed(2)}`;
      resultBest.textContent = `Tu mejor CPS hasta ahora: ${bestCps.toFixed(2)}`;

      modalOverlay.classList.add('active');
    }

    restartBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      clicks = 0;
      timeLeft = totalTime;
      clickCountDisplay.textContent = '0';
      currentCpsDisplay.textContent = '0.0';
      timerDisplay.textContent = totalTime.toFixed(1) + 's';
      areaText.textContent = '¡Haz clic aquí para empezar!';
      subText.textContent = 'El tiempo comenzará con tu primer clic';
    });
  </script>
</body>
</html>
